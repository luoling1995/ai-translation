<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 翻译助手设置 (Antigravity)</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24">
      <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
    </svg>
    <h1 class="header-title">AI 翻译助手 (Antigravity)</h1>
  </div>

  <div class="content">
    <div class="form-group">
      <label for="api-key" class="form-label">MiniMax API Key</label>
      <input type="password" id="api-key" class="form-input" placeholder="请输入 MiniMax API Key">
      <div id="api-key-error" class="error-text"></div>
    </div>

    <div class="form-group">
      <label for="model-name" class="form-label">模型名称</label>
      <input type="text" id="model-name" class="form-input" placeholder="MiniMax-M2.7">
    </div>

    <div class="button-row">
      <button id="test-connection" class="btn btn-secondary">测试连接</button>
      <button id="save-config" class="btn btn-primary">保存设置</button>
    </div>

    <hr class="divider">

    <div class="action-section">
      <button id="translate-page" class="btn btn-action" disabled>翻译当前页面</button>
      <button id="restore-page" class="btn btn-action" disabled>恢复原文</button>
    </div>

    <div class="status-section">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">正在检查当前页面状态...</span>
    </div>
  </div>

  <script src="../popup.js"></script>
</body>
</html>
